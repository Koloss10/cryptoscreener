name: Probe exchanges
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Response shapes of public OKX endpoints (no account or key needed)
        run: |
          show() { echo "== $1"; curl -s -m 15 "$2" | head -c "${3:-400}"; echo; }
          show "tickers"      "https://www.okx.com/api/v5/market/tickers?instType=SWAP" 500
          show "funding"      "https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP" 500
          show "open-interest all" "https://www.okx.com/api/v5/public/open-interest?instType=SWAP" 400
          show "books (sz=400)" "https://www.okx.com/api/v5/market/books?instId=BTC-USDT-SWAP&sz=400" 300
          show "instruments"  "https://www.okx.com/api/v5/public/instruments?instType=SWAP" 700
          show "candles 1m"   "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=1m&limit=2" 300
