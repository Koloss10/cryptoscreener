name: Probe exchanges
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public market endpoints reachable from this runner?
        run: |
          check() { printf '%-34s ' "$1"; curl -s -o /dev/null -m 15 -w '%{http_code} %{time_total}s\n' "$2" || echo "curl failed"; }
          check "binance fapi ticker"        "https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT"
          check "binance fapi depth"         "https://fapi.binance.com/fapi/v1/depth?symbol=BTCUSDT&limit=1000"
          check "binance fapi openInterest"  "https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT"
          check "binance spot (api)"         "https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT"
          check "binance data-api.vision"    "https://data-api.binance.vision/api/v3/ticker/24hr?symbol=BTCUSDT"
          check "bybit linear tickers"       "https://api.bybit.com/v5/market/tickers?category=linear"
          check "bybit orderbook"            "https://api.bybit.com/v5/market/orderbook?category=linear&symbol=BTCUSDT&limit=200"
          check "okx swap tickers"           "https://www.okx.com/api/v5/market/tickers?instType=SWAP"
          check "bitget tickers"             "https://api.bitget.com/api/v2/mix/market/tickers?productType=USDT-FUTURES"
          check "gate futures tickers"       "https://api.gateio.ws/api/v4/futures/usdt/tickers"
          check "mexc futures ticker"        "https://contract.mexc.com/api/v1/contract/ticker"
          check "hyperliquid info"           "https://api.hyperliquid.xyz/info"
