name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and the browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Unit tests (збирачі, ядро торгівлі, функція exchange, порівняння)
        run: node --test tests/*.test.js tests/*.test.mjs
      - name: Browser smoke tests (мережа підроблена)
        run: node tests/smoke.js
