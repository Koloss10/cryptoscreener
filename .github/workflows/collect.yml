name: Collect market data
on:
  schedule:
    - cron: '3-59/5 * * * *'     # хвилини 3, 8, 13…: не на кратних 5 (найзавантаженіші моменти GitHub)
  workflow_dispatch:
permissions:
  contents: write          # лише запис у гілку data; секретів не використовується
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect public data (no accounts or keys); one exchange failing does not stop the others
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          ok=0
          for ex in okx bitget gate mexc; do
            if node collector/run.mjs "$ex" "$RUNNER_TEMP/out"; then ok=$((ok+1)); else echo "::warning::$ex failed, its previous snapshot stays"; fi
          done
          [ "$ok" -gt 0 ]
      - name: Publish to the data branch (single commit, history is not kept)
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git worktree add --detach "$RUNNER_TEMP/data" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/data"
            git -C "$RUNNER_TEMP/data" rm -rfq . || true
          fi
          cd "$RUNNER_TEMP/data"
          # у добовий архів — раз на 15 хв і лише топ-100 монет (інакше гілка роздувається); повний знімок — щоразу
          archive=0; [ $(( 10#$(date -u +%M) / 5 % 3 )) -eq 0 ] && archive=1
          for f in "$RUNNER_TEMP"/out/*.json; do
            case "$f" in *.compact.json) continue;; esac
            ex=$(basename "$f" .json)
            mkdir -p "$ex"
            cp "$f" "$ex/latest.json"
            if [ "$archive" -eq 1 ]; then cat "$RUNNER_TEMP/out/$ex.compact.json" >> "$ex/$(date -u +%F).ndjson"; fi
            find "$ex" -name '*.ndjson' -mtime +3 -delete
          done
          git checkout -q --orphan snap
          git add -A
          git -c user.name='collector' -c user.email='collector@users.noreply.github.com' commit -q -m "snapshots $(date -u +%FT%TZ)"
          git push -q --force origin snap:data
